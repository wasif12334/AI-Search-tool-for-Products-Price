[project]
name = "ai-searchtool-for-products-price"
version = "0.1.0"
description = "AI Search Tool for Products Price"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "streamlit>=1.49.1",
    "langchain>=1.3.14",
    "langchain-core>=1.5.3",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.2",
    "python-dotenv>=1.2.2",
    "tavily-python",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"